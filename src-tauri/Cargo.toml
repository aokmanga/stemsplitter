[package]
name = "stemsplitter"
version = "0.1.0"
description = "Stem Splitter - DAW leggera per separare tracce audio con Demucs"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = [ "fs-read-dir", "fs-read-file", "fs-exists", "dialog-all", "shell-open", "path-all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
